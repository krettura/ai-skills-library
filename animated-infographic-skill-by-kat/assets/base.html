<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{TITLE}}</title>
<style id="fonts">
{{FONT_FACES}}
</style>
<style id="brand">
/* ===== Brand system. Generated by scripts/brandkit.py from brand/brand.json. Never hand-edit per infographic. ===== */
:root{
{{CSS_VARS}}
  --dim:.22;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="dark"],:root[data-theme="light"]{color-scheme:normal}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--page:var(--bg)}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg)}
body{padding:12px} body.export{padding:0}
#wrap{width:100%;max-width:600px;margin:0 auto;position:relative;overflow:hidden}
body.export #wrap{max-width:1080px}
#stage{width:1080px;height:1350px;position:absolute;top:0;left:0;transform-origin:0 0;background:var(--bg);overflow:hidden;font-family:var(--f-body);color:var(--text)}
.mono,.lbl{font-family:var(--f-label);text-transform:var(--label-case);letter-spacing:var(--label-track)}
.backdrop{position:absolute;inset:0;pointer-events:none}
.backdrop.rays i{position:absolute;top:0;background:linear-gradient(var(--accent-a55),transparent)}
.backdrop.texture{background-size:cover;background-position:center;opacity:var(--texture-opacity,.22);-webkit-mask-image:linear-gradient(#000,transparent 42%);mask-image:linear-gradient(#000,transparent 42%)}
.backdrop.texture.full{-webkit-mask-image:none;mask-image:none}
.photo{display:block;width:100%;height:100%;object-fit:cover;border-radius:calc(var(--radius) - 4px)}
.backdrop.glow{background:radial-gradient(ellipse 70% 38% at 50% 0%,var(--accent-a40),transparent 70%)}
.backdrop.grid{background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:54px 54px;opacity:.35;-webkit-mask-image:linear-gradient(#000,transparent 45%);mask-image:linear-gradient(#000,transparent 45%)}
#content{position:absolute;left:40px;right:40px;top:128px;bottom:84px;display:flex;flex-direction:column;align-items:stretch}
.footer{position:absolute;left:0;right:0;top:1282px;height:50px;display:flex;align-items:center;justify-content:center}
.footer .pill{height:50px;padding:0 30px;border-radius:25px;background:var(--pill-bg);border:2px solid var(--line);color:var(--pill-text);font-size:26px;display:flex;align-items:center;gap:12px}
.footer .pill span{text-transform:none;letter-spacing:.5px}
.footer img{max-height:44px;max-width:360px}
/* ----- shared building blocks ----- */
.eyebrow{text-align:center;color:var(--accent-hi);font-size:26px;margin:16px 0 8px}
.headline{margin:0;text-align:center;font-family:var(--f-head);font-size:60px;line-height:1.08;font-weight:var(--head-weight);letter-spacing:-1.5px;color:var(--text)}
.headline .accent{color:var(--accent-hi)}
.subhead{text-align:center;color:var(--muted);font-size:28px;margin-top:10px}
.footnote{text-align:center;color:var(--muted);font-size:30px;margin-top:16px}
.label{color:var(--accent-hi);font-size:24px}
.rowlabel{color:var(--text);font-size:24px}
.sublabel{color:var(--label);font-size:20px;margin-top:8px;text-transform:none;letter-spacing:.5px}
.card{background:var(--card);border:2px solid var(--line);border-radius:var(--radius);padding:20px 18px}
.card .title{font-family:var(--f-label);text-transform:var(--label-case);letter-spacing:var(--label-track);color:var(--accent-hi);font-size:21px;margin-bottom:8px}
.card .body{font-size:22px;line-height:1.3;color:var(--text)}
.chip{display:inline-block;background:var(--card);border:2px solid var(--line);border-radius:999px;padding:8px 16px;font-size:20px;color:var(--text)}
.connector{stroke:var(--line);stroke-width:3;fill:none}
/* numbered markers (steps, timelines). Point a stop at one with data-anchor="#id" and the mascot lands on it */
.marker{width:88px;height:88px;border-radius:50%;background:var(--bg);border:3px solid var(--accent);display:flex;align-items:center;justify-content:center;font-family:var(--f-label);font-size:34px;color:var(--text);position:relative;z-index:1}
.marker.on{background:var(--accent);border-color:var(--ring);color:var(--on-accent)}
/* ----- reveal system: every .stop sits dim until the mascot lands on it ----- */
.stop{--r:1}
.stop > *{opacity:calc(var(--dim) + (1 - var(--dim)) * var(--r))}
.stop.on{border-color:var(--accent);background:var(--card-on)}
/* ----- mascot (the brand mark that hops) ----- */
.cz{position:absolute;left:0;top:0;z-index:50;pointer-events:none}
#mascot{z-index:60}
#ghost{opacity:.16}
#ghost img,#mascot img{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:100%;height:100%;object-fit:contain}
#badge{position:absolute;inset:0;border-radius:50%;background:var(--plate);border:4px solid var(--ring);box-shadow:0 6px 18px rgba(0,0,0,.25)}
</style>
<style id="format">
{{FORMAT_CSS}}
</style>
</head>
<body>
<div id="wrap"><div id="stage" role="img" aria-label="{{ALT_TEXT}}">
{{BACKDROP}}
<div id="content">
{{CONTENT}}
</div>
{{FOOTER}}
<div class="cz" id="ghost"><img alt="" src="{{MARK_SRC}}"></div>
<div class="cz" id="mascot"><div id="badge"></div><img id="mimg" alt="" src="{{MARK_SRC}}"></div>
</div></div>
<script>
/* ===== Mascot engine. Big brand mark sits home at top, shrinks into a badge, visits every .stop in data-stop order, flies home. Loops seamlessly. ===== */
(function(){
var exportMode=/export/.test(location.search);if(exportMode)document.body.classList.add('export');
var stage=document.getElementById('stage'),wrap=document.getElementById('wrap'),content=document.getElementById('content');
var mascot=document.getElementById('mascot'),badge=document.getElementById('badge'),mimg=document.getElementById('mimg'),ghost=document.getElementById('ghost');
var BIG=+getComputedStyle(document.documentElement).getPropertyValue('--home-size')||130,HOME={x:540,y:Math.max(70,140-BIG/2-6)},SMALL=80,MIN_LOOP=11000;
var HOME_PLATE=getComputedStyle(document.documentElement).getPropertyValue('--home-plate').trim()==='1';
var IMG_IN_BADGE=.6,IMG_HOME=HOME_PLATE?.62:1;
function fit(){var s=wrap.clientWidth/1080;stage.style.transform='scale('+s+')';wrap.style.height=(1350*s)+'px';}
fit();addEventListener('resize',function(){fit();layout();});
function put(el,x,y,w){el.style.width=w+'px';el.style.height=w+'px';el.style.transform='translate('+(x-w/2)+'px,'+(y-w/2)+'px)';}
function look(bo){var b=HOME_PLATE?1:bo;badge.style.opacity=b;var s=lerp(IMG_HOME,IMG_IN_BADGE,bo);mimg.style.width=(s*100)+'%';mimg.style.height=(s*100)+'%';}
put(ghost,HOME.x,HOME.y,BIG);put(mascot,HOME.x,HOME.y,BIG);look(0);
function ez(u){return u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2}
function cl(v){return Math.max(0,Math.min(1,v))}
function lerp(a,b,u){return a+(b-a)*u}
var stops=[],starts=[],retStart=0,TOTAL=1,LEAD=900,DEPART=900,HOLD=450,RETURN=900;
function layout(){
 var sr=stage.getBoundingClientRect(),k=sr.width/1080;
 stops=[].slice.call(document.querySelectorAll('.stop')).map(function(el,i){
  var a=el.dataset.anchor?document.querySelector(el.dataset.anchor):null,r=(a||el).getBoundingClientRect(),p=el.dataset.perch||(a?'c':'tr');
  var L=(r.left-sr.left)/k,T=(r.top-sr.top)/k,R=(r.right-sr.left)/k,B=(r.bottom-sr.top)/k;
  var m={tr:{x:R-10,y:T+2},tl:{x:L+10,y:T+2},top:{x:(L+R)/2,y:T+2},r:{x:R-4,y:(T+B)/2},l:{x:L+4,y:(T+B)/2},c:{x:(L+R)/2,y:(T+B)/2}};
  var pt=m[p]||m.tr;return {el:el,anchor:a,x:pt.x,y:pt.y,n:+(el.dataset.stop||i+1)};
 }).sort(function(a,b){return a.n-b.n});
 var n=stops.length,fixed=LEAD+DEPART+HOLD+RETURN+250,budget=22000-fixed;
 var per=Math.max(420,Math.min(2200,Math.max(950,(MIN_LOOP-fixed)/Math.max(1,n-1)),budget/Math.max(1,n-1)));
 var HOP=Math.min(per*.74,900),REST=per-HOP,t=LEAD;starts=[];
 stops.forEach(function(s,i){var d=i===0?DEPART:HOP;starts.push({s:t,d:d});t+=d+REST;});
 retStart=t+HOLD;TOTAL=retStart+RETURN;window.__total=TOTAL;
}
function render(tm){
 if(!stops.length)return;
 var x=HOME.x,y=HOME.y,w=BIG,bo=0,last=stops[stops.length-1];
 if(tm>=LEAD&&tm<retStart){
  var i=stops.length-1;for(var k=0;k<starts.length-1;k++){if(tm<starts[k+1].s){i=k;break;}}
  var st=starts[i],to=stops[i],from=i===0?HOME:stops[i-1],u=cl((tm-st.s)/st.d),e=ez(u);
  x=lerp(from.x,to.x,e);y=lerp(from.y,to.y,e)-Math.sin(Math.PI*u)*(i===0?90:60);
  if(i===0){w=lerp(BIG,SMALL,e);bo=cl(u/.35);}else{w=SMALL;bo=1;}
 }else if(tm>=retStart){
  var u2=cl((tm-retStart)/RETURN),e2=ez(u2);
  x=lerp(last.x,HOME.x,e2);y=lerp(last.y,HOME.y,e2)-Math.sin(Math.PI*u2)*90;w=lerp(SMALL,BIG,e2);bo=1-cl((u2-.65)/.35);
 }
 put(mascot,x,y,w);look(bo);
 var fade=tm>=retStart?1-cl((tm-retStart-250)/550):1;
 stops.forEach(function(s,i){var rv=starts[i].s+starts[i].d,a=cl((tm-rv)/400)*fade,on=tm>=rv&&fade>.5;s.el.style.setProperty('--r',a.toFixed(3));s.el.classList.toggle('on',on);if(s.anchor)s.anchor.classList.toggle('on',on);});
}
function still(){stops.forEach(function(s){s.el.style.setProperty('--r',1);s.el.classList.add('on');if(s.anchor)s.anchor.classList.add('on');});put(mascot,HOME.x,HOME.y,BIG);look(0);}
function qa(){
 var out=[],cr=content.getBoundingClientRect();
 content.querySelectorAll('*').forEach(function(el){var r=el.getBoundingClientRect();if(!r.width||el.closest('svg'))return;
  if(r.bottom>cr.bottom+1||r.right>cr.right+1||r.left<cr.left-1)out.push('OUT OF BOUNDS: '+(el.className||el.tagName)+' "'+(el.textContent||'').trim().slice(0,40)+'"');
  if((el.classList.contains('card')||el.classList.contains('stop'))&&(el.scrollHeight>el.clientHeight+2||el.scrollWidth>el.clientWidth+2))out.push('TEXT OVERFLOW: "'+(el.textContent||'').trim().slice(0,40)+'"');});
 if(!stops.length)out.push('NO STOPS: add class="stop" to the elements the mascot should visit');
 if(stops.length>24)out.push('TOO MANY STOPS ('+stops.length+'): group them. Max about 24 keeps the GIF under 400 frames');
 if(!mimg.complete||!mimg.naturalWidth)out.push('MASCOT IMAGE FAILED TO LOAD: check brand mark file');
 return out;
}
function mascotCheck(){
 var sr=stage.getBoundingClientRect(),k=sr.width/1080;return stops.map(function(s,i){render(starts[i].s+starts[i].d+50);var r=mascot.getBoundingClientRect();
  var cx=r.left+r.width/2,cy=r.top+r.height/2;mascot.style.pointerEvents='auto';var hit=document.elementFromPoint(cx,cy);mascot.style.pointerEvents='';
  return {stop:s.n,x:Math.round((cx-sr.left)/k),y:Math.round((cy-sr.top)/k),w:Math.round(r.width/k),visible:!!(hit&&hit.closest&&hit.closest('#mascot'))};});}
window.__render=render;window.__still=still;window.__qa=qa;window.__mascotCheck=mascotCheck;
var imgReady=new Promise(function(res){if(mimg.complete)res();else{mimg.onload=res;mimg.onerror=res;}});
window.__ready=Promise.all([document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve(),imgReady]).then(function(){layout();render(0);return true;});
if(exportMode)return;
var reduce=false;try{reduce=matchMedia('(prefers-reduced-motion: reduce)').matches}catch(e){}
window.__ready.then(function(){if(reduce){still();return;}
 var t0=null;function frame(ts){if(t0===null)t0=ts;render((ts-t0)%TOTAL);requestAnimationFrame(frame);}requestAnimationFrame(frame);});
})();
</script>
</body>
</html>
